name: Build Images

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Image version tag (e.g. v1.1.0). Leave empty for tag-triggered runs.'
        required: false
        type: string
      targets:
        description: 'Space-separated list of push targets (default: core). Options: openclaw-base agentteams-controller embedded manager manager-qwenpaw worker copaw-worker hermes-worker qwenpaw-worker. Default core set = agentteams-controller embedded manager-qwenpaw (we only use the DeepSeek Harness worker runtime; other runtimes are not built).'
        required: false
        type: string
        default: 'agentteams-controller embedded manager-qwenpaw'
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: read
  # Required to publish images to GitHub Container Registry. A called reusable
  # workflow can never hold more permission than its caller, so this must be
  # granted here as well as in build-image.yml — otherwise the login step gets a
  # token without package write access and the push fails with 403.
  packages: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      targets: ${{ steps.meta.outputs.targets }}
    steps:
      - name: Resolve build targets and dependencies
        id: meta
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          REQUESTED_TARGETS: ${{ inputs.targets }}
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          import re

          dependencies = {
              'openclaw-base': [],
              'agentteams-controller': [],
              'embedded': ['agentteams-controller'],
              'manager': ['openclaw-base', 'agentteams-controller'],
              'manager-qwenpaw': ['agentteams-controller'],
              'worker': ['openclaw-base', 'agentteams-controller'],
              'copaw-worker': ['agentteams-controller'],
              'hermes-worker': ['agentteams-controller'],
              'qwenpaw-worker': [],
          }
          tagged = os.environ['GITHUB_REF'].startswith('refs/tags/')
          version = os.environ['GITHUB_REF_NAME'] if tagged else os.environ['REQUESTED_VERSION'] or 'latest'
          if not re.fullmatch(r'[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}', version):
              raise SystemExit('Invalid image version')
          # Default build set = core images only. We use the DeepSeek Harness
          # worker runtime; the other worker images (openclaw worker, copaw,
          # hermes, qwenpaw) and openclaw-base/manager are NOT built by default.
          # Tagged releases build this same core set unless overridden via
          # workflow_dispatch `targets` input.
          default_targets = 'agentteams-controller embedded manager-qwenpaw'
          requested_input = os.environ.get('REQUESTED_TARGETS', '').strip() or ''
          requested = 'all' if requested_input == 'all' else (requested_input or default_targets)
          if tagged and not requested_input:
              requested = default_targets
          selected = set(dependencies) if requested == 'all' else set(requested.split())
          if not selected or selected - dependencies.keys():
              raise SystemExit('Unknown or empty build targets: ' + requested)
          for target in list(selected):
              selected.update(dependencies[target])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print('version=' + version, file=output)
              print('targets=' + json.dumps(sorted(selected)), file=output)
          PYTHON

  openclaw-base:
    needs: [prepare]
    if: contains(fromJSON(needs.prepare.outputs.targets), 'openclaw-base')
    uses: ./.github/workflows/build-image.yml
    with:
      target: openclaw-base
      version: ${{ needs.prepare.outputs.version }}
    secrets: inherit

  agentteams-controller:
    needs: [prepare]
    if: contains(fromJSON(needs.prepare.outputs.targets), 'agentteams-controller')
    uses: ./.github/workflows/build-image.yml
    with:
      target: agentteams-controller
      version: ${{ needs.prepare.outputs.version }}
    secrets: inherit

  embedded:
    needs: [prepare, agentteams-controller]
    if: contains(fromJSON(needs.prepare.outputs.targets), 'embedded')
    uses: ./.github/workflows/build-image.yml
    with:
      target: embedded
      version: ${{ needs.prepare.outputs.version }}
    secrets: inherit

  manager:
    needs: [prepare, openclaw-base, agentteams-controller]
    if: contains(fromJSON(needs.prepare.outputs.targets), 'manager')
    uses: ./.github/workflows/build-image.yml
    with:
      target: manager
      version: ${{ needs.prepare.outputs.version }}
    secrets: inherit

  manager-qwenpaw:
    needs: [prepare, agentteams-controller]
    if: contains(fromJSON(needs.prepare.outputs.targets), 'manager-qwenpaw')
    uses: ./.github/workflows/build-image.yml
    with:
      target: manager-qwenpaw
      version: ${{ needs.prepare.outputs.version }}
    secrets: inherit

  worker:
    needs: [prepare, openclaw-base, agentteams-controller]
    if: contains(fromJSON(needs.prepare.outputs.targets), 'worker')
    uses: ./.github/workflows/build-image.yml
    with:
      target: worker
      version: ${{ needs.prepare.outputs.version }}
    secrets: inherit

  copaw-worker:
    needs: [prepare, agentteams-controller]
    if: contains(fromJSON(needs.prepare.outputs.targets), 'copaw-worker')
    uses: ./.github/workflows/build-image.yml
    with:
      target: copaw-worker
      version: ${{ needs.prepare.outputs.version }}
    secrets: inherit

  hermes-worker:
    needs: [prepare, agentteams-controller]
    if: contains(fromJSON(needs.prepare.outputs.targets), 'hermes-worker')
    uses: ./.github/workflows/build-image.yml
    with:
      target: hermes-worker
      version: ${{ needs.prepare.outputs.version }}
    secrets: inherit

  qwenpaw-worker:
    needs: [prepare]
    if: contains(fromJSON(needs.prepare.outputs.targets), 'qwenpaw-worker')
    uses: ./.github/workflows/build-image.yml
    with:
      target: qwenpaw-worker
      version: ${{ needs.prepare.outputs.version }}
    secrets: inherit

  release:
    needs: [prepare, openclaw-base, agentteams-controller, embedded, manager, manager-qwenpaw, worker, copaw-worker, hermes-worker, qwenpaw-worker]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
      # Job-level permissions REPLACE the top-level set rather than merging with
      # it, so packages: read must be restated here. The release job inspects the
      # published manifests before creating the release.
      packages: read
    uses: ./.github/workflows/release.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
    secrets: inherit
