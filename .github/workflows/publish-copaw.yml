name: Publish CoPaw Worker to PyPI

# NOTE (fork): the `release: published` trigger is intentionally removed. This
# workflow publishes the `copaw` package to the public PyPI index, which is the
# upstream project's distribution channel, and it needs PYPI_API_TOKEN /
# TEST_PYPI_API_TOKEN secrets that this fork does not hold. Firing on every fork
# release would produce failed runs and would attempt to publish under the
# upstream package name. Kept as manual dispatch so the packaging logic remains
# available.
on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Publish target'
        required: true
        default: 'pypi'
        type: choice
        options:
          - pypi
          - testpypi

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # Required for trusted publishing
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tools
        run: pip install build

      - name: Build package
        run: |
          cd copaw
          python -m build

      - name: Publish to PyPI
        if: github.event.inputs.target != 'testpypi' && (github.event_name == 'release' || github.event.inputs.target == 'pypi')
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: copaw/dist/
          password: ${{ secrets.PYPI_API_TOKEN }}

      - name: Publish to TestPyPI
        if: github.event.inputs.target == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: copaw/dist/
          repository-url: https://test.pypi.org/legacy/
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}
