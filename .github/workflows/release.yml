name: Release

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v1.2.3 or v1.2.3-beta.1)'
        required: true
        type: string

env:
  # Images live in GitHub Container Registry for this fork (the upstream Aliyun
  # registry is not writable here). This must match the REGISTRY/REPO used by
  # build.yml / build-image.yml so release verification finds the images.
  REGISTRY: ghcr.io
  REPO: ${{ github.repository_owner }}
  # DeepSeek Harness runtime image tag. This is its OWN version line,
  # independent of the AgentTeams release version and of the @deepseek-ai/dsh
  # version baked into the image. Bump it when publishing a new runtime build.
  DEEPSEEK_HARNESS_WORKER_VERSION: v0.1.0

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version
        id: version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          # Validate stable or pre-release SemVer format.
          if ! echo "${VERSION}" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "ERROR: invalid version format: ${VERSION}"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          if [[ "${VERSION}" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify versioned multi-architecture images
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Keep this list aligned with the default release targets in build.yml.
          # We only build the DeepSeek Harness worker runtime; the OpenClaw/
          # CoPaw/Hermes/QwenPaw worker images and openclaw-base are NOT built by
          # default (kept only as Helm references), so they are intentionally
          # excluded from this required-images check.
          images=(
            agentteams-controller agentteams-embedded agentteams-manager-qwenpaw
          )
          for image in "${images[@]}"; do
            ref="${REGISTRY}/${REPO}/${image}:${VERSION}"
            manifest="$(docker buildx imagetools inspect "$ref" --raw)"
            jq -e '
              any(.manifests[]?; .platform.os == "linux" and .platform.architecture == "amd64") and
              any(.manifests[]?; .platform.os == "linux" and .platform.architecture == "arm64")
            ' >/dev/null <<<"$manifest" || {
              echo "ERROR: missing required architectures for $ref"
              exit 1
            }
          done

      - name: Create tag (workflow_dispatch only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${VERSION}" || echo "Tag already exists, skipping"
          git push origin "${VERSION}" || echo "Tag already pushed, skipping"

      - name: Build release body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          REGISTRY="${{ env.REGISTRY }}"
          REPO="${{ env.REPO }}"
          REPOSITORY="${{ github.repository }}"

          # Generate release notes from PRs merged since the previous release.
          auto_notes=$(gh api "repos/${REPOSITORY}/releases/generate-notes" \
            -f tag_name="${VERSION}" \
            --jq '.body')

          if [[ "${VERSION}" == *-* ]]; then
            STABLE_VERSION=$(gh api "repos/${REPOSITORY}/releases/latest" --jq '.tag_name')
          else
            STABLE_VERSION="${VERSION}"
          fi

          cat > /tmp/quick-start.md << EOF
          ## Quick Start

          ### Latest stable (\`${STABLE_VERSION}\`)

          #### macOS / Linux

          \`\`\`bash
          bash <(curl -fsSL https://raw.githubusercontent.com/${REPOSITORY}/${STABLE_VERSION}/install/agentteams-install.sh)
          \`\`\`

          #### Windows (PowerShell 7+)

          \`\`\`powershell
          Set-ExecutionPolicy Bypass -Scope Process -Force; \$wc=New-Object Net.WebClient; \$wc.Encoding=[Text.Encoding]::UTF8; iex \$wc.DownloadString('https://raw.githubusercontent.com/${REPOSITORY}/${STABLE_VERSION}/install/agentteams-install.ps1')
          \`\`\`
          EOF

          if [[ "${VERSION}" == *-* ]]; then
            cat >> /tmp/quick-start.md << EOF

          ### Beta preview (\`${VERSION}\`, explicit opt-in)

          #### macOS / Linux

          \`\`\`bash
          AGENTTEAMS_VERSION=${VERSION} bash <(curl -fsSL https://raw.githubusercontent.com/${REPOSITORY}/${VERSION}/install/agentteams-install.sh)
          \`\`\`

          #### Windows (PowerShell 7+)

          \`\`\`powershell
          \$env:AGENTTEAMS_VERSION='${VERSION}'; Set-ExecutionPolicy Bypass -Scope Process -Force; \$wc=New-Object Net.WebClient; \$wc.Encoding=[Text.Encoding]::UTF8; iex \$wc.DownloadString('https://raw.githubusercontent.com/${REPOSITORY}/${VERSION}/install/agentteams-install.ps1')
          \`\`\`
          EOF
          fi

          quick_start=$(cat /tmp/quick-start.md)

          cat > /tmp/release-body.md << EOF
          ${auto_notes}

          ---

          ## Docker Images

          Multi-architecture images (amd64 + arm64):

          \`\`\`bash
          # Embedded all-in-one (infra + controller; pulled by the installer)
          docker pull ${REGISTRY}/${REPO}/agentteams-embedded:${VERSION}

          # QwenPaw Manager (lightweight; spawned by the embedded controller)
          docker pull ${REGISTRY}/${REPO}/agentteams-manager-qwenpaw:${VERSION}

          # Controller (used standalone in k8s; bundled inside agentteams-embedded for docker installs)
          docker pull ${REGISTRY}/${REPO}/agentteams-controller:${VERSION}

          # DeepSeek Harness Worker (experimental; the only built worker runtime)
          docker pull ${REGISTRY}/${REPO}/agentteams-deepseek-harness-worker:${DEEPSEEK_HARNESS_WORKER_VERSION}
          \`\`\`

          > Other worker runtimes (OpenClaw, CoPaw, Hermes, QwenPaw) are kept
          > as Helm references but are not built by this fork's CI.
          > The Manager image here is the QwenPaw runtime; there is no OpenClaw
          > manager build in this fork.

          ---

          ${quick_start}

          ---

          ## Documentation

          For more details, see the [installation guide](https://github.com/${REPOSITORY}/blob/main/install/README.md).
          EOF

      - name: Verify and smoke-test DeepSeek Harness runtime image
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.REPO }}/agentteams-deepseek-harness-worker:${{ env.DEEPSEEK_HARNESS_WORKER_VERSION }}"
          AVAILABLE=false
          for attempt in 1 2 3 4 5; do
            if docker buildx imagetools inspect "${IMAGE}" >/dev/null 2>&1; then
              AVAILABLE=true
              break
            fi
            if [ "${attempt}" -lt 5 ]; then sleep 15; fi
          done
          if [ "${AVAILABLE}" != "true" ]; then
            echo "ERROR: required DeepSeek Harness runtime image is not pullable: ${IMAGE}"
            exit 1
          fi
          docker pull --platform linux/amd64 "${IMAGE}"
          docker run --rm --platform linux/amd64 --entrypoint sh "${IMAGE}" -ec '
            command -v dsh >/dev/null
            test -x /opt/agentteams/scripts/deepseek-harness-worker-entrypoint.sh
            test -f /opt/agentteams/plugins/teamharness/plugin.yaml
            python3 -m py_compile \
              /opt/agentteams/scripts/runtime_env.py \
              /opt/agentteams/scripts/matrix_channel.py \
              /opt/agentteams/scripts/matrix_bridge.py
          '

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          body_path: /tmp/release-body.md
          prerelease: ${{ steps.version.outputs.prerelease }}
